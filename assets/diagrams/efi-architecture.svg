  <rect x="120" y="170" width="350" height="150" rx="28" fill="#0E1530" stroke="#72E7FF" stroke-width="2"/>
  <text x="295" y="220" fill="#72E7FF" font-size="24" font-weight="700">FIELD COMPUTING · GLYPH</text>
  <text x="295" y="258" fill="#F7FAFF" font-size="20">field transition is computation</text>
  <text x="295" y="290" fill="#AEB9D8" font-size="17">possibility · constraint · proof · retention</text>

