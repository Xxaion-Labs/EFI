  <text x="1305" y="290" fill="#AEB9D8" font-size="17">without identity fusion</text>

  <rect x="95" y="650" width="410" height="150" rx="28" fill="#0E1530" stroke="#72E7FF" stroke-width="2"/>
  <text x="300" y="700" fill="#72E7FF" font-size="24" font-weight="700">FAP · NUTS</text>
  <text x="300" y="738" fill="#F7FAFF" font-size="20">world boundary + local embodiment</text>
  <text x="300" y="770" fill="#AEB9D8" font-size="17">mechanics stay mechanics</text>

  <rect x="1095" y="650" width="410" height="150" rx="28" fill="#0E1530" stroke="#A477FF" stroke-width="2"/>
  <text x="1300" y="700" fill="#C6B2FF" font-size="24" font-weight="700">ZION · COMMONS</text>
  <text x="1300" y="738" fill="#F7FAFF" font-size="20">coordination without central capture</text>
  <text x="1300" y="770" fill="#AEB9D8" font-size="17">Human Inheritance protects critical fruits</text>

  <rect x="610" y="95" width="380" height="115" rx="58" fill="#10162C" stroke="url(#g)" stroke-width="3"/>
  <text x="800" y="143" fill="#F7FAFF" font-size="28" font-weight="800">EUI · ATTRACTOR</text>
  <text x="800" y="177" fill="#AEB9D8" font-size="18">civilization-scale exocortical integration</text>
