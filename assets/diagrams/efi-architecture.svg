<rect width="1600" height="920" rx="36" fill="#070A18"/>
<text x="800" y="70" text-anchor="middle" fill="#F7FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="750">One field geometry · distinct authority boundaries</text>
