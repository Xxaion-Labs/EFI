 <g transform="translate(580 125)"><rect width="440" height="235" rx="28" fill="#090C16" stroke="#A855FF" stroke-width="3"/><circle cx="390" cy="44" r="10" fill="#A855FF" filter="url(#glow)"/><text x="34" y="60" fill="#C986FF" font-size="25" font-weight="900">GOO</text><text x="34" y="95" fill="#8E97B5" font-size="14" letter-spacing="3">CONTINUITY</text><text x="34" y="150" fill="#F7FAFF" font-size="18">Authenticated continuity-bearing</text><text x="34" y="183" fill="#F7FAFF" font-size="18">personal EFI body.</text></g>
