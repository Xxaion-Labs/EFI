 <g transform="translate(80 405)"><rect width="440" height="235" rx="28" fill="#090C16" stroke="#FF8A00" stroke-width="3"/><circle cx="390" cy="44" r="10" fill="#FF8A00" filter="url(#glow)"/><text x="34" y="60" fill="#FFB04C" font-size="25" font-weight="900">EFI</text><text x="34" y="95" fill="#8E97B5" font-size="14" letter-spacing="3">PERSON + EXOCORTEX</text><text x="34" y="150" fill="#F7FAFF" font-size="18">Human coupled to persistent</text><text x="34" y="183" fill="#F7FAFF" font-size="18">exocortical intelligence.</text></g>
