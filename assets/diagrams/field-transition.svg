<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Field Computing transition</title>
<desc id="desc">EFI visual asset by Xxaion Labs.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72E7FF"/><stop offset="1" stop-color="#A477FF"/></linearGradient>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#121B3A"/><stop offset="1" stop-color="#050714"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="620" rx="36" fill="#070A18"/>
<text x="800" y="66" text-anchor="middle" fill="#F7FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="750">Field Computing: lawful state transition</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <rect x="70" y="180" width="280" height="220" rx="28" fill="#0E1530" stroke="#72E7FF" stroke-width="2"/>
  <text x="210" y="235" fill="#72E7FF" font-size="24" font-weight="700">CURRENT FIELD</text>
  <text x="210" y="280" fill="#F7FAFF" font-size="18">contact · evidence · authority</text>
  <text x="210" y="312" fill="#F7FAFF" font-size="18">causal time · possibilities</text>
  <text x="210" y="344" fill="#F7FAFF" font-size="18">retained force · rivals</text>

  <rect x="440" y="150" width="350" height="280" rx="28" fill="#111A36" stroke="url(#g)" stroke-width="3"/>
  <text x="615" y="205" fill="#F7FAFF" font-size="24" font-weight="800">ATTRACTOR + CONSTRAINT</text>
  <text x="615" y="252" fill="#AEB9D8" font-size="17">DISTINGUISH · RELATE · CONSTRAIN</text>
  <text x="615" y="284" fill="#AEB9D8" font-size="17">TRANSFORM · COMPOSE · RECURSE</text>
  <text x="615" y="316" fill="#AEB9D8" font-size="17">SELECT · RETAIN · PROJECT</text>
  <text x="615" y="370" fill="#72E7FF" font-size="19">reality falsifies counterfeit successors</text>

  <rect x="880" y="180" width="280" height="220" rx="28" fill="#0E1530" stroke="#A477FF" stroke-width="2"/>
  <text x="1020" y="235" fill="#C6B2FF" font-size="24" font-weight="700">LAWFUL SUCCESSOR</text>
  <text x="1020" y="280" fill="#F7FAFF" font-size="18">minimum required projection</text>
  <text x="1020" y="312" fill="#F7FAFF" font-size="18">mechanics only where needed</text>
  <text x="1020" y="344" fill="#F7FAFF" font-size="18">candidate ≠ CURRENT until court</text>

  <rect x="1250" y="180" width="280" height="220" rx="28" fill="#0E1530" stroke="#72E7FF" stroke-width="2"/>
  <text x="1390" y="235" fill="#72E7FF" font-size="24" font-weight="700">WORLD + RESULT</text>
  <text x="1390" y="280" fill="#F7FAFF" font-size="18">bits · files · APIs · devices</text>
  <text x="1390" y="312" fill="#F7FAFF" font-size="18">raw evidence returns to field</text>
  <text x="1390" y="344" fill="#F7FAFF" font-size="18">retain gain or roll back</text>
</g>
<g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"><path d="M350 290H430"/><path d="M790 290H870"/><path d="M1160 290H1240"/><path d="M1390 410C1390 535 1020 555 800 505C560 450 320 500 210 410" opacity=".65"/></g>
<text x="800" y="585" text-anchor="middle" fill="#AEB9D8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Constraint is the interface between possibility and actuality — and the engine of infinity.</text>
</svg>