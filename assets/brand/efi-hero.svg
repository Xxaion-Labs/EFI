<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="t d">
<title id="t">EFI — Extracortical Field Intelligence</title>
<desc id="d">Neon field-computing identity: acid green sigil, cracked metallic EFI letters, orange, violet, magenta and cyan field waves on void black.</desc>
