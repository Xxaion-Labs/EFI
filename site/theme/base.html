<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="{{FAVICON}}">
  <link rel="manifest" href="{{BASE_PATH}}/site.webmanifest">
  <link rel="stylesheet" href="{{BASE_PATH}}/theme/site.css">
  <title>{{TITLE}} · EFI</title>
  <script type="application/ld+json">{{JSON_LD}}</script>
</head>
<body data-route="{{ROUTE}}" data-surface="{{SURFACE}}">
  <div class="efi-systembar" aria-hidden="true"><span>FIELD COMPUTING</span><i></i><span>OPEN RESEARCH</span><i></i><span>EXPERIMENTAL INFRASTRUCTURE</span><b>SCIENCE / SYSTEMS / PEOPLE / POSSIBILITY</b></div>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{BASE_PATH}}/" aria-label="EFI home">
      <img src="{{FAVICON}}" alt="" width="36" height="36">
      <span>EFI</span><small>FIELD SYSTEM</small>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">{{PRIMARY_NAV}}</nav>
    <button class="search-open" type="button" aria-haspopup="dialog" aria-controls="search-dialog" title="Search (/)" aria-label="Search">⌕</button>
  </header>

  <div class="efi-header-rail" aria-hidden="true"><span></span><i></i><span></span></div>

  <div class="page-shell">
    <main id="content" class="content" tabindex="-1">
      <article class="doc">{{CONTENT}}</article>
      <div class="end-mark"><img src="{{END_MARK}}" alt="" loading="lazy"></div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-brand"><span>EFI · Xxaion Labs</span><a href="https://github.com/Xxaion-Labs/EFI">Source on GitHub</a></div>
    <nav class="utility-nav" aria-label="Reference navigation">{{REFERENCE_NAV}}</nav>
  </footer>

  <dialog id="search-dialog" class="search-dialog" aria-label="Search EFI">
    <form method="dialog" class="search-top"><strong>Search EFI</strong><button aria-label="Close">×</button></form>
    <label class="sr-only" for="search-input">Search</label>
    <input id="search-input" type="search" autocomplete="off" placeholder="architecture, CORE, proof…">
    <div id="search-results" class="search-results" aria-live="polite"></div>
  </dialog>
  <script src="{{BASE_PATH}}/theme/site.js" defer></script>
</body>
</html>
